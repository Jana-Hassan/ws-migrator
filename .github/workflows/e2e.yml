name: E2E

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - run: go install sigs.k8s.io/kind@v0.33.0

      - run: go vet -tags e2e ./test/e2e/

      - run: go test -tags e2e -count=1 -v -timeout 35m ./test/e2e/
