syntax = "proto3";

package migrator.v1;

option go_package = "github.com/Jana-Hassan/ws-migrator/proto;migratorpb";

service WorkerService {
  rpc Checkpoint(CheckpointRequest) returns (CheckpointResponse);
  rpc Restore(RestoreRequest) returns (RestoreResponse);
  rpc HealthStream(HealthStreamRequest) returns (stream HealthUpdate);
}

service GatewayService {
  rpc Drain(DrainRequest) returns (DrainResponse);
  rpc Register(RegisterRequest) returns (RegisterResponse);
  rpc Unregister(UnregisterRequest) returns (UnregisterResponse);
}

message RegisterRequest {
  string worker_id = 1;
  string ws_addr = 2;
  string grpc_addr = 3;
  string token = 4;
}

message RegisterResponse {
  bool ok = 1;
  string error = 2;
}

message UnregisterRequest {
  string worker_id = 1;
  string token = 2;
}

message UnregisterResponse {
  bool ok = 1;
}

message CheckpointRequest {
  string session_id = 1;
}

message CheckpointResponse {
  string session_id = 1;
  bytes state = 2;
  bool ok = 3;
  string error = 4;
  uint64 applied_seq = 5;
}

message RestoreRequest {
  string session_id = 1;
  bytes state = 2;
  uint64 applied_seq = 3;
}

message RestoreResponse {
  bool ok = 1;
  string error = 2;
}

message DrainRequest {
  string worker_id = 1;
  string reason = 2;
  string token = 3;
}

message DrainResponse {
  bool accepted = 1;
  int32 session_count = 2;
}

message HealthStreamRequest {}

message HealthUpdate {
  string worker_id = 1;
  int32 session_count = 2;
  WorkerStatus status = 3;
  int64 unix_ms = 4;
  uint64 snapshot_failures = 5;
  uint64 snapshots_written = 6;
}

enum WorkerStatus {
  WORKER_STATUS_UNSPECIFIED = 0;
  WORKER_STATUS_SERVING = 1;
  WORKER_STATUS_DRAINING = 2;
  WORKER_STATUS_STOPPING = 3;
}
